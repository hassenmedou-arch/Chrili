# اشريلي — رسالة واتساب للمالك عند كل تحديث للتطبيق
# الأسرار (GitHub ← Settings ← Secrets and variables ← Actions):
#   WA_PHONE  = رقمك مع رمز الدولة، مثل +22236369979
#   WA_APIKEY = المفتاح الذي يرسله لك CallMeBot
name: whatsapp-notify
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp
        env:
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          if [ -z "$WA_PHONE" ] || [ -z "$WA_APIKEY" ]; then echo "WhatsApp secrets not set — skipped"; exit 0; fi
          MSG=$(python3 - <<'PY'
          import json, os
          cs = json.loads(os.environ.get('COMMITS') or '[]')
          lines = []
          for c in cs[-5:]:
              first = (c.get('message') or '').split('\n')[0].strip()
              if first: lines.append('• ' + first)
          if not lines: lines = ['• تحديث بدون وصف']
          print('🟢 *اشريلي — تحديث جديد*\n' + '\n'.join(lines) + '\n\n🔗 https://chrili.pages.dev')
          PY
          )
          curl -sS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$WA_PHONE" \
            --data-urlencode "apikey=$WA_APIKEY" \
            --data-urlencode "text=$MSG" | head -c 300; echo
